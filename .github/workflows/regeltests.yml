name: Projektprüfung

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regeltests:
    name: Regeltests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript-Syntax prüfen
        run: |
          node --check spiel/klassen.js
          node --check spiel/faehigkeiten.js
          node --check spiel/kampf.js
          node --check spiel/welt.js
          node --check spiel/systeme-daten.js
          node --check spiel/systeme.js
          node --check spiel/regeln.js
          node --check spiel/spiel.js
          node --check spiel/karte-daten.js
          node --check spiel/karte.js
          node --check spiel/knoten-daten.js
          node --check spiel/knoten.js
          node --check spiel/nebenquests-daten.js
          node --check spiel/nebenquests.js
          node --check spiel/reisekarte-daten.js
          node --check spiel/reisekarte.js
          node --check spiel/oberflaeche.js
          node --check spiel/npcs.js
      - name: Spielregeln testen
        run: |
          node --test spiel/regeln.test.cjs
          node --test spiel/kampf.test.cjs
          node --test spiel/karte.test.cjs
          node --test spiel/nebenquests.test.cjs
          node --test spiel/reisekarte.test.cjs
          node --test spiel/systeme.test.cjs
          node --test spiel/npcs.test.cjs
          node --test spiel/patch254.test.cjs
          node --test spiel/patch255.test.cjs
          node --test spiel/patch260.test.cjs
